<!DOCTYPE html>
<html>
<head>
  <title>Audio Compressor</title>
</head>
<body>
  <h1>Upload an MP3</h1>
  <form method="POST" action="/api/v1/process" enctype="multipart/form-data">
    <input type="file" name="file" accept="audio/*" required>
    <button type="submit">Compress</button>
  </form>
</body>
</html>
